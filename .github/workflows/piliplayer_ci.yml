name: PiliPlayer CI

# CI for the `piliplayer` branch (Android only).
# The development sandbox cannot build Flutter apps (1 GiB RAM / 2 vCPU),
# so every verification (analyze / test / apk build) happens here.
#
# 推 `v*` tag 时: debug + release 双模式构建, 产物(APK + SHA256SUMS)
# 全部上传到该 tag 对应的 GitHub Release(不存在则自动创建 prerelease)。

on:
    push:
        branches:
            - piliplayer
        tags:
            - "v*"
        paths-ignore:
            - "**.md"
            - "docs/**"
    pull_request:
        branches:
            - piliplayer
    workflow_dispatch:
        inputs:
            build_apk:
                description: "Build Android APK"
                type: boolean
                default: true
            apk_mode:
                description: "APK build mode"
                type: choice
                default: "debug"
                options:
                    - debug
                    - release
            upload_apk:
                description: "Upload APK as artifact"
                type: boolean
                default: true

concurrency:
    group: piliplayer-ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    # paths added by this branch: analyzed with zero tolerance (infos included)
    STRICT_PATHS: >-
        lib/pages/local_media
        lib/pages/video/introduction/local_media
        lib/services/local_media_service.dart
        lib/services/smb
        lib/models/local_media
        lib/plugin/pl_player/models/vr_projection.dart
        lib/plugin/pl_player/utils/vr_shader.dart
        lib/utils/local_media_progress.dart
        test/plugin/vr_test.dart
        test/services/local_media_service_test.dart
        test/utils/local_media_progress_test.dart
        test/services/smb/smb_protocol_test.dart
        test/services/smb/smb_live_test.dart
        test/services/smb/smb_share_enum_test.dart
        lib/plugin/pl_player/widgets/vr_control_layer.dart
        lib/plugin/pl_player/utils/vr_gyro.dart
        lib/plugin/pl_player/utils/vr_gyro_math.dart
        test/services/local_media_source_test.dart

jobs:
    check:
        name: Analyze & Test
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: 代码迁出
              uses: actions/checkout@v7

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            # patches the Flutter SDK + material_ui / cupertino_ui in pub-cache,
            # and runs `flutter pub get`
            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Analyze (errors are fatal)
              shell: bash
              run: |
                  set -uo pipefail
                  # 仓库基线本身有若干 info 级提示, 因此这里只把 error 视为失败,
                  # warning/info 计数写进 job summary; 新增代码另有一步零容忍检查
                  flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
                    | tee analyze.txt || true
                  err=$(grep -cE '(^|[[:space:]])error[[:space:]]+•' analyze.txt || true)
                  warn=$(grep -cE '(^|[[:space:]])warning[[:space:]]+•' analyze.txt || true)
                  info=$(grep -cE '(^|[[:space:]])info[[:space:]]+•' analyze.txt || true)
                  echo "::notice::analyze summary errors=$err warnings=$warn infos=$info"
                  if [ "$err" != "0" ]; then
                    echo "::error::flutter analyze reported $err error(s)"
                    grep -E '(^|[[:space:]])error[[:space:]]+•' analyze.txt | head -60
                    exit 1
                  fi
                  echo "analyze: no errors"

            - name: Analyze new code (zero tolerance)
              shell: bash
              run: |
                  set -uo pipefail
                  paths=""
                  for p in $STRICT_PATHS; do
                    [ -e "$p" ] && paths="$paths $p"
                  done
                  if [ -z "$paths" ]; then
                    echo "no strict paths present yet"
                    exit 0
                  fi
                  echo "strict analyze:$paths"
                  dart analyze --fatal-infos $paths

            - name: Test
              run: flutter test --no-pub --reporter expanded

    build_android:
        name: Build Android (${{ matrix.mode }})
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 70
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apk }}
        permissions:
            # tag 推送时要把构建产物传到对应 Release
            contents: write
        strategy:
            fail-fast: false
            matrix:
                # tag -> debug + release 都建; 分支 push -> debug; 手动触发 -> 所选模式
                mode: "${{ fromJSON(github.ref_type == 'tag' && '[\"debug\",\"release\"]' || format('[\"{0}\"]', github.event.inputs.apk_mode || 'debug')) }}"
        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            # 让测试包自报家门: 关于页会显示 Commit Hash / Build Time,
            # 否则装机后无法判断手上这个 apk 到底是哪次提交构建的。
            - name: 注入构建信息
              shell: bash
              run: |
                  set -euo pipefail
                  {
                    echo "PILI_HASH=$(git rev-parse HEAD)"
                    echo "PILI_TIME=$(date +%s)"
                    echo "PILI_CODE=$(git rev-list --count HEAD)"
                  } >> "$GITHUB_ENV"

            - name: Build Debug Apk
              if: ${{ matrix.mode == 'debug' }}
              run: >-
                  flutter build apk --debug --target-platform android-arm64
                  --dart-define=pili.hash=${{ env.PILI_HASH }}
                  --dart-define=pili.time=${{ env.PILI_TIME }}
                  --dart-define=pili.code=${{ env.PILI_CODE }}
                  --no-pub

            - name: Build Release Apk
              if: ${{ matrix.mode == 'release' }}
              run: >-
                  flutter build apk --release --split-per-abi
                  --android-project-arg dev=1
                  --dart-define=pili.hash=${{ env.PILI_HASH }}
                  --dart-define=pili.time=${{ env.PILI_TIME }}
                  --dart-define=pili.code=${{ env.PILI_CODE }}
                  --no-pub

            - name: List outputs
              run: ls -la build/app/outputs/flutter-apk/ || true

            - name: Upload artifact
              if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_apk }}
              uses: actions/upload-artifact@v7
              with:
                  name: PiliPlayer-android-${{ matrix.mode }}-${{ github.sha }}
                  path: build/app/outputs/flutter-apk/*.apk
                  if-no-files-found: error
                  retention-days: 14

            # tag 推送: 把本 leg 的全部 APK 传到该 tag 的 GitHub Release。
            # Release 一般已提前建好; 没有就兜底建一个 prerelease
            # (debug/release 两条腿并发, create 用 || true 兜竞态)。
            - name: 上传到 tag Release
              if: ${{ github.ref_type == 'tag' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  tag="$GITHUB_REF_NAME"
                  mode="${{ matrix.mode }}"
                  cd build/app/outputs/flutter-apk
                  ls -la
                  sums="PiliPlayer-${tag}-${mode}-SHA256SUMS.txt"
                  sha256sum ./*.apk > "$sums"
                  cat "$sums"
                  if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
                      --title "PiliPlayer ${tag} (测试构建)" \
                      --notes "由 CI 自动创建, 构建自 ${GITHUB_SHA}。" || true
                  fi
                  gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber ./*.apk "$sums"
                  echo "::notice::已上传 ${mode} 构建产物到 release ${tag}"
