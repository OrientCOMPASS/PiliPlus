name: PiliPlayer CI

# App CI for the local-media (VLC) branch:
#  - analyze + unit tests on every app-relevant push
#  - arm64-v8a RELEASE build (no debug builds; a failing step means no release)
#  - with publish=true (dispatch) or on tag v2.1.5-test: delete the old
#    release+tag first, then recreate the release on the new commit, so the
#    download URL never changes and only one test package exists.

on:
    workflow_dispatch:
        inputs:
            publish:
                description: "Publish v2.1.5-test release from HEAD"
                type: boolean
                default: false
    push:
        branches:
            - piliplayer
        paths:
            - "lib/**"
            - "android/**"
            - "test/**"
            - "pubspec.yaml"
            - "pubspec.lock"
            - "assets/**"
            - ".github/workflows/piliplayer_ci.yml"

permissions: write-all

concurrency:
    group: piliplayer-app-ci
    cancel-in-progress: ${{ github.event_name == 'push' }}

env:
    RELEASE_TAG: v2.1.5-test
    APK_NAME: PiliPlus-v2.1.5-test-arm64-v8a.apk

jobs:
    analyze:
        name: Analyze & test
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v7

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Install dependencies
              run: flutter pub get

            - name: Analyze
              run: flutter analyze --no-fatal-infos

            - name: Unit tests
              run: flutter test

    build:
        name: Build arm64-v8a release
        needs: analyze
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: zulu
                  java-version: "17"
                  cache: gradle
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Flutter patches
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Fetch patched libvlc AAR (libvlc-pvr)
              run: |
                  set -e
                  mkdir -p android/app/libs
                  URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/libvlc-pvr/libvlc-pvr-arm64-v8a.aar"
                  if curl -f -sL --retry 3 -o android/app/libs/libvlc-pvr.aar "$URL"; then
                    echo "Using patched libvlc-pvr AAR:"
                    sha256sum android/app/libs/libvlc-pvr.aar
                  else
                    echo "::warning::libvlc-pvr AAR not available; falling back to stock libvlc (VR disabled)"
                  fi

            - name: Prepare build info
              run: |
                  COMMIT_HASH=$(git rev-parse HEAD)
                  BUILD_TIME=$(date +%s)
                  VERSION_NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+)\+([0-9]+)/\1/')
                  VERSION_CODE=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+)\+([0-9]+)/\2/')
                  cat > pili_release.json <<EOF
                  {"pili.name":"$VERSION_NAME","pili.code":$VERSION_CODE,"pili.hash":"$COMMIT_HASH","pili.time":$BUILD_TIME}
                  EOF
                  cat pili_release.json

            - name: Install dependencies
              run: flutter pub get

            - name: Build release APK (arm64-v8a only)
              run: |
                  flutter build apk --release --split-per-abi \
                    --target-platform android-arm64 \
                    --dart-define-from-file=pili_release.json --no-pub

            - name: Package artifacts
              run: |
                  set -e
                  cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$APK_NAME"
                  sha256sum "$APK_NAME" > SHA256SUMS.txt
                  cat SHA256SUMS.txt
                  # sanity: the APK must carry our signature and version
                  BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
                  "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$APK_NAME" | head -3 || true
                  "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" dump badging "$APK_NAME" | grep -E "^package" || true

            - name: Upload workflow artifact
              uses: actions/upload-artifact@v7
              with:
                  name: android-arm64-v8a-release
                  path: |
                      ${{ env.APK_NAME }}
                      SHA256SUMS.txt

            - name: Publish release (rolling tag)
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -e
                  API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
                  AUTH="Authorization: Bearer ${GH_TOKEN}"
                  COMMIT=$(git rev-parse HEAD)

                  # delete old release + same-name tag first (download URL stays stable)
                  OLD_ID=$(curl -sf -H "$AUTH" "$API/releases/tags/$RELEASE_TAG" | jq -r .id || echo "")
                  if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "null" ]; then
                    curl -sf -X DELETE -H "$AUTH" "$API/releases/$OLD_ID" || true
                  fi
                  curl -sf -X DELETE -H "$AUTH" "$API/git/refs/tags/$RELEASE_TAG" || true
                  sleep 3

                  # recreate tag on the new commit
                  curl -sf -X POST -H "$AUTH" "$API/git/refs" \
                    -d "{\"ref\":\"refs/tags/$RELEASE_TAG\",\"sha\":\"$COMMIT\"}" || \
                  curl -sf -X PATCH -H "$AUTH" "$API/git/refs/tags/$RELEASE_TAG" \
                    -d "{\"sha\":\"$COMMIT\",\"force\":true}"

                  NOTES_FILE=RELEASE_NOTES.md
                  if [ -f "$NOTES_FILE" ]; then NOTES=$(cat "$NOTES_FILE"); else NOTES="PiliPlus 本地板块测试构建（commit ${COMMIT:0:9}）。"; fi

                  jq -n --arg tag "$RELEASE_TAG" --arg name "PiliPlayer $RELEASE_TAG (测试构建)" \
                        --arg body "$NOTES" --arg sha "$COMMIT" \
                        '{tag_name:$tag,name:$name,body:$body,target_commitish:$sha}' > /tmp/rel.json
                  curl -sf -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
                    "$API/releases" -d @/tmp/rel.json > /tmp/rel_out.json
                  UPLOAD_URL=$(jq -r .upload_url /tmp/rel_out.json | sed 's/{?name,label}//')
                  for f in "$APK_NAME" SHA256SUMS.txt; do
                    curl -sf -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
                      "$UPLOAD_URL?name=$f" --data-binary "@$f" > /dev/null
                  done
                  echo "Published release $RELEASE_TAG at commit $COMMIT"
